[package]
name = "horizon-ios-bridge"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "C ABI for the native SwiftUI Horizon iPhone shell"

[lib]
crate-type = ["staticlib"]

[dependencies]
horizon-client = { path = "../horizon-client", default-features = false }
horizon-core = { path = "../horizon-core" }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "wgsl", "naga-ir"] }
raw-window-handle = "0.6"
pollster = "0.4"

[lints]
workspace = true

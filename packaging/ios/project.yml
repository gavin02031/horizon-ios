name: Horizon
options:
  bundleIdPrefix: com.gavin02031
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Horizon:
    type: application
    platform: iOS
    sources:
      - path: SwiftUI
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gavin02031.horizonios
        INFOPLIST_FILE: SwiftUI/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        SWIFT_OBJC_BRIDGING_HEADER: SwiftUI/HorizonBridge.h
        CODE_SIGN_STYLE: Manual
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        LIBRARY_SEARCH_PATHS: "$(inherited) $(PROJECT_DIR)/../../target/aarch64-apple-ios/release"
        OTHER_LDFLAGS: "$(inherited) -lc++ -lresolv -framework Metal -framework QuartzCore -framework Security -framework SystemConfiguration -framework CoreGraphics -framework CoreFoundation -framework Foundation -framework UIKit"
    dependencies:
      - framework: ../../target/aarch64-apple-ios/release/libhorizon_ios_bridge.a
        embed: false
schemes:
  Horizon:
    build:
      targets:
        Horizon: all
    run:
      config: Debug
    archive:
      config: Release
